name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev, "INT-*"]

# Stop a previous in-progress run for the same branch on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Supabase local stack. Ports shifted to 55xxx range to avoid clashes with
      # any other local Supabase projects (matches supabase/config.toml).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ""
      # pg_prove needs the local DB credentials.
      PGHOST: 127.0.0.1
      PGPORT: "55322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint, typecheck, format
        run: npm run check

      # ------------------------------------------------------------------------
      # Database: start local stack, reset (apply all migrations), run pgTAP.
      # ------------------------------------------------------------------------

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database (apply all migrations)
        run: npx supabase db reset

      - name: Run pgTAP RLS tests
        run: npm run db:test

      # ------------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------------

      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: web

      - name: Tauri static export smoke test
        # Verifies the static-export code path still works. A full Tauri
        # build isn't possible without a Tauri toolchain, but the Next export
        # alone is the load-bearing check.
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop --no-backup
