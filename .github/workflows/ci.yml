name: CI

on:
  push:
    branches: [main, dev, "INT-*"]
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev, "INT-*"]

# Stop a previous in-progress run for the same branch on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Supabase local stack. Ports shifted to 55xxx range to avoid clashes with
      # any other local Supabase projects (matches supabase/config.toml).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ""
      # pg_prove needs the local DB credentials.
      PGHOST: 127.0.0.1
      PGPORT: "55322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom@30 / undici@8 require Node >= 22 (Node 20 is EOL as of 2026-04).
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint, typecheck, format
        run: npm run check

      # ------------------------------------------------------------------------
      # Database: start local stack, reset (apply all migrations), run pgTAP.
      # ------------------------------------------------------------------------

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database (apply all migrations)
        run: npx supabase db reset

      - name: Install pg_prove
        timeout-minutes: 5
        run: |
          if command -v pg_prove >/dev/null 2>&1; then
            pg_prove --version
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y libtap-parser-sourcehandler-pgtap-perl
          fi

      - name: Run pgTAP RLS tests
        run: npm run db:test

      # ------------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------------

      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: web

      - name: Cloudflare Worker smoke build
        run: |
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -d .open-next/assets
          size=$(stat -c%s .open-next/server-functions/default/handler.mjs)
          echo "handler.mjs size: $size bytes"
          if [ "$size" -gt 26214400 ]; then echo "Worker handler exceeds 25 MiB"; exit 1; fi

      - name: Regenerate service worker for OpenNext and verify PWA assets
        run: |
          node scripts/generate-service-worker.mjs --opennext
          node scripts/verify-pwa-assets.mjs

      - name: Verify no secret in wrangler vars or client bundle
        run: node scripts/verify-cloudflare-env.mjs --build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser validation
        run: npm run test:ui-validation

      - name: Tauri static export smoke test
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Upload browser validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop --no-backup

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Workers on push to main — #163
  # The `ci` job already runs the OpenNext smoke build on every PR, so a PR
  # that breaks the Cloudflare build fails CI before merge. On merge to main
  # this job deploys production to Cloudflare. Vercel's own GitHub app keeps
  # deploying in parallel during the transition window (vercel.json stays),
  # so both deploy paths coexist until Vercel is retired.
  # --------------------------------------------------------------------------
  deploy:
    name: deploy (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        env:
          # Public env needed at build time for Next.js to embed in the client
          # bundle and to avoid prerender failures (e.g. /api/export). Values
          # mirror wrangler.toml [vars] (production) — public, safe to keep in
          # the workflow. Secrets (service role, Resend, etc.) are not needed
          # at build time and are injected at runtime via `wrangler secret`.
          NEXT_PUBLIC_SUPABASE_URL: https://xfjhzkgaxbycubcsurdn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Skbn9yZ8iBEOVD0Cz8JtjA_sH4NtLjJ
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key-compat
          NEXT_PUBLIC_API_BASE_URL: ""
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          APP_URL: https://duobalanceapp.com
        run: |
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -d .open-next/assets
          size=$(stat -c%s .open-next/server-functions/default/handler.mjs)
          echo "handler.mjs size: $size bytes"
          if [ "$size" -gt 26214400 ]; then echo "Worker handler exceeds 25 MiB"; exit 1; fi
          node scripts/generate-service-worker.mjs --opennext
          node scripts/verify-pwa-assets.mjs
          node scripts/verify-cloudflare-env.mjs --build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
