name: CI

on:
  push:
    branches: [main, dev, "INT-*"]
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev, "INT-*"]

# Stop a previous in-progress run for the same branch on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Supabase local stack. Ports shifted to 55xxx range to avoid clashes with
      # any other local Supabase projects (matches supabase/config.toml).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_LOCAL_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ""
      # pg_prove needs the local DB credentials.
      PGHOST: 127.0.0.1
      PGPORT: "55322"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # jsdom@30 / undici@8 require Node >= 22 (Node 20 is EOL as of 2026-04).
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint, typecheck, format
        run: npm run check

      # ------------------------------------------------------------------------
      # Database: start local stack, reset (apply all migrations), run pgTAP.
      # ------------------------------------------------------------------------

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset database (apply all migrations)
        run: npx supabase db reset

      - name: Install pg_prove
        timeout-minutes: 5
        run: |
          if command -v pg_prove >/dev/null 2>&1; then
            pg_prove --version
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y libtap-parser-sourcehandler-pgtap-perl
          fi

      - name: Run pgTAP RLS tests
        run: npm run db:test

      # ------------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------------

      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: web

      - name: Cloudflare Worker smoke build
        run: |
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -d .open-next/assets
          size=$(stat -c%s .open-next/server-functions/default/handler.mjs)
          echo "handler.mjs size: $size bytes"
          if [ "$size" -gt 26214400 ]; then echo "Worker handler exceeds 25 MiB"; exit 1; fi

      - name: Regenerate service worker for OpenNext and verify PWA assets
        run: |
          node scripts/generate-service-worker.mjs --opennext
          node scripts/verify-pwa-assets.mjs

      - name: Verify no secret in wrangler vars or client bundle
        run: node scripts/verify-cloudflare-env.mjs --build

      # ----------------------------------------------------------------------
      # Service-role-key leak guard — #20. Two layers, ordered by where the
      # leak would happen (CLAUDE.md hard rule #1/#2):
      #
      #   1. Source — grep src/ for the env var name. Catches hand-written
      #      mistakes (e.g. someone adding the key to a client component).
      #   2. Bundle — grep .next/static/ for the JWT prefix after the build.
      #
      #   verify-cloudflare-env covers the wrangler.toml + client-bundle
      #   identifier check for ALL secrets; this guard is the additional
      #   src/ allowlist + JWT-prefix check for the service role specifically.
      #   Both checks pass on this codebase; proven to fail by injecting a
      #   dummy reference and observing the workflow exit non-zero.
      # ----------------------------------------------------------------------
      - name: Service-role-key leak guard (source)
        run: |
          set -euo pipefail
          if grep -rEn "SUPABASE_SERVICE_ROLE_KEY" src/ \
              | grep -vE "(lib/env\.ts|lib/supabase/server\.ts|lib/supabase/cron\.ts|app/api/)"; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is referenced outside lib/supabase/server.ts, lib/supabase/cron.ts and app/api/**"
            exit 1
          fi
          echo "src/ leak guard: OK"

      - name: Service-role-key leak guard (bundle)
        run: |
          set -euo pipefail
          # The JWT header eyJhbGci... is shared by anon and service_role keys,
          # so a plain prefix grep would flag the legitimate public anon key
          # (NEXT_PUBLIC_SUPABASE_ANON_KEY) which is expected in the client
          # bundle. Match the service_role payload instead: base64url for
          # "service_role" is c2VydmljZV9yb2xl, which only the service JWT
          # contains (anon payload is "anon" -> YW5vbg). This keeps the guard
          # from false-positiving on anon while still catching a leaked
          # service_role JWT value. The identifier check in
          # verify-cloudflare-env covers the env var name.
          if grep -rF "c2VydmljZV9yb2xl" .next/static/ 2>/dev/null; then
            echo "::error::A service_role JWT payload was found in .next/static/. The service-role key may have leaked into a client bundle."
            exit 1
          fi
          # sb_secret_ appears literally in supabase-js source as
          # `key.startsWith("sb_secret_")` for new-format key detection, so a
          # plain prefix grep would always fire. Match the secret value shape:
          # sb_secret_ + at least 10 alphanum/_/- chars (real key is 27+, e.g.
          # sb_secret_xIN6wBbl...). The literal `sb_secret_"` or `sb_secret_…`
          # in library code has no alphanum after the underscore before the
          # closing quote/ellipsis and will not match.
          if grep -rE "sb_secret_[A-Za-z0-9_-]{10,}" .next/static/ 2>/dev/null; then
            echo "::error::sb_secret_ value pattern was found in .next/static/. The SUPABASE_SECRET_KEY may have leaked."
            exit 1
          fi
          echo ".next/static leak guard: OK"

      # ----------------------------------------------------------------------
      # Billing-flag guard — #262. Two properties, ordered cheap-first:
      #
      #   1. Single accessor — grep src/ for the flag name. Every read must
      #      go through isBillingEnabled() in src/lib/billing/enabled.ts;
      #      test files stub the env and are excluded.
      #   2. Default off — no committed config (wrangler vars, .env.example)
      #      may carry a truthy flag value; production deploys with it off.
      #
      #   The vitest suite (src/lib/billing/enabled.test.ts) locks the same
      #   properties; this guard fails the workflow even if tests are skipped.
      # ----------------------------------------------------------------------
      - name: Billing-flag guard — single accessor, default off
        run: |
          set -euo pipefail
          if grep -rEn "BILLING_ENABLED" src/ \
              | grep -vE "(\.test\.(ts|tsx)|lib/billing/enabled\.ts)"; then
            echo "::error::BILLING_ENABLED is referenced outside src/lib/billing/enabled.ts (and tests). All reads must go through isBillingEnabled()."
            exit 1
          fi
          echo "billing single-accessor guard: OK"
          # Case-insensitive: the accessor lowercases before comparing, so
          # "TRUE"/"True"/"ON" in committed config would also turn billing on.
          if grep -riEn '^\s*(NEXT_PUBLIC_)?BILLING_ENABLED\s*=\s*["'"'"']?(1|true|yes|on)\b' wrangler.toml .env.example 2>/dev/null; then
            echo "::error::BILLING_ENABLED defaults on in committed config — the flag must default off (#262)."
            exit 1
          fi
          echo "billing default-off guard: OK"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser validation
        run: npm run test:ui-validation

      - name: Tauri static export smoke test
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Upload browser validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop --no-backup

  # --------------------------------------------------------------------------
  # Deploy to Cloudflare Workers — #163 + staging auto-deploy
  # The `ci` job already runs the OpenNext smoke build on every PR, so a PR
  # that breaks the Cloudflare build fails CI before merge.
  # - Push to `main` → production (`duobalance` Worker, duobalanceapp.com)
  # - Push to `dev`  → staging (`duobalance-staging` Worker, staging.duobalanceapp.com)
  #   in confluence (together) with the existing Vercel deploys — both deploy
  #   paths coexist until Vercel is retired. Staging auto-deploy makes `dev`
  #   merges immediately testable on https://staging.duobalanceapp.com.
  # --------------------------------------------------------------------------
  deploy:
    name: deploy (Cloudflare prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        env:
          # Public env needed at build time for Next.js to embed in the client
          # bundle and to avoid prerender failures (e.g. /api/export). Values
          # mirror wrangler.toml [vars] (production) — public, safe to keep in
          # the workflow. Secrets (service role, Resend, etc.) are not needed
          # at build time and are injected at runtime via `wrangler secret`.
          NEXT_PUBLIC_SUPABASE_URL: https://xfjhzkgaxbycubcsurdn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Skbn9yZ8iBEOVD0Cz8JtjA_sH4NtLjJ
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key-compat
          NEXT_PUBLIC_API_BASE_URL: ""
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          APP_URL: https://duobalanceapp.com
          # Billing exposure flag, client mirror (#262) — explicitly OFF.
          # NEXT_PUBLIC_* values are inlined at build time, so wrangler
          # [vars] (runtime bindings) cannot flip the client gate: going
          # live requires setting this to "1" here AND BILLING_ENABLED=1 in
          # the Worker vars, then redeploying. See
          # docs/billing-go-live-checklist.md.
          NEXT_PUBLIC_BILLING_ENABLED: ""
        run: |
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -d .open-next/assets
          size=$(stat -c%s .open-next/server-functions/default/handler.mjs)
          echo "handler.mjs size: $size bytes"
          if [ "$size" -gt 26214400 ]; then echo "Worker handler exceeds 25 MiB"; exit 1; fi
          node scripts/generate-service-worker.mjs --opennext
          node scripts/verify-pwa-assets.mjs
          node scripts/verify-cloudflare-env.mjs --build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-staging:
    name: deploy (Cloudflare staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    concurrency:
      group: deploy-staging-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Cloudflare Worker (staging)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://xfjhzkgaxbycubcsurdn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Skbn9yZ8iBEOVD0Cz8JtjA_sH4NtLjJ
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key-compat-staging
          NEXT_PUBLIC_API_BASE_URL: ""
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          VAPID_PUBLIC_KEY: BLZTGM0jMxny8fFJCJSLr2J-MF18hcRuOJNlSx8p-yjJNpC5jS69SaCXjjftXmBOpRWpDrwckBdCsLwloVKKMzQ
          APP_URL: https://staging.duobalanceapp.com
          # Billing exposure flag, client mirror (#262) — explicitly OFF.
          # Build-time inlined (see production deploy job): flip here AND in
          # the staging Worker vars together, never one side alone.
          NEXT_PUBLIC_BILLING_ENABLED: ""
        run: |
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -d .open-next/assets
          size=$(stat -c%s .open-next/server-functions/default/handler.mjs)
          echo "handler.mjs size: $size bytes"
          if [ "$size" -gt 26214400 ]; then echo "Worker handler exceeds 25 MiB"; exit 1; fi
          node scripts/generate-service-worker.mjs --opennext
          node scripts/verify-pwa-assets.mjs
          node scripts/verify-cloudflare-env.mjs --build

      - name: Deploy to Cloudflare Workers (staging)
        run: npx wrangler deploy --env staging --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
